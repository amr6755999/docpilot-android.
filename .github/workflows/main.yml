
name: Build DocPilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: |
          mkdir -p source bundle

          if [ -f DocPilot_Android_Prototype.zip ]; then
            unzip -q DocPilot_Android_Prototype.zip -d source
          else
            OUTER=$(find . -maxdepth 1 -name 'DocPilot_Mobile_Cloud_Build_Kit*.zip' | head -n 1)
            if [ -z "$OUTER" ]; then
              echo "Project ZIP not found"
              exit 1
            fi

            unzip -q "$OUTER" -d bundle

            INNER=$(find bundle -name 'DocPilot_Android_Prototype.zip' | head -n 1)
            if [ -z "$INNER" ]; then
              echo "Inner project ZIP not found"
              exit 1
            fi

            unzip -q "$INNER" -d source
          fi

          test -f source/DocPilot_Android_Prototype/settings.gradle.kts

      - name: Build APK
        working-directory: source/DocPilot_Android_Prototype
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocPilot-APK
          path: source/DocPilot_Android_Prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
